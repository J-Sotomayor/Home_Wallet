name: homewallet
description: "Finanzas personales y colaborativas por espacios."
publish_to: 'none'
version: 1.0.8+9

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  cloud_functions: ^6.3.5
  firebase_app_check: ^0.4.5+2
  firebase_crashlytics: ^5.2.6
  firebase_messaging: ^16.4.3
  flutter_secure_storage: ^10.3.1
  flutter_local_notifications: ^19.5.0
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  cryptography: ^2.9.0
  intl: ^0.19.0
  firebase_storage: ^13.4.5
  image_picker: ^1.2.1
  crop_your_image: 2.0.0
  file_picker: ^11.0.3
  google_sign_in: 7.2.0
  excel: 4.0.6
  excel2003: 1.0.0
  pdf: 3.11.3
  read_pdf_text: 0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: 2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/generated/logo_horizontal.png
    - assets/branding/generated/logo_white.png
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/generated/app_icon_1024.png
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: assets/branding/generated/app_icon_foreground.png
  adaptive_icon_monochrome: assets/branding/generated/app_icon_monochrome.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 23
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F3F4F6"
  color_dark: "#111827"
  image: assets/branding/generated/app_icon_1024.png
  image_dark: assets/branding/generated/app_icon_1024.png
  android: true
  ios: true
  web: false
  fullscreen: false
  android_12:
    color: "#F3F4F6"
    color_dark: "#111827"
    image: assets/branding/generated/splash_logo.png
    image_dark: assets/branding/generated/splash_logo.png
    icon_background_color: "#2563EB"
    icon_background_color_dark: "#1D4ED8"
